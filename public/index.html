<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpendek Tautan</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1c2230; --muted:#667085; --accent:#3b6cf6; --border:#d9dfeb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1c212c; --text:#eef1f7; --muted:#9aa4b8; --accent:#6f93ff; --border:#2e3646; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  main { width:100%; max-width:520px; background:var(--card); padding:28px; border-radius:16px; border:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
          background:transparent; color:var(--text); font-size:1rem; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px;
           background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  #result { margin-top:18px; display:none; padding:12px; border-radius:10px; border:1px solid var(--border); }
  #result a { color:var(--accent); word-break:break-all; font-weight:600; }
  #result button { margin-top:10px; padding:8px; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #error { color:#e5484d; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<main>
  <h1>Perpendek Tautan</h1>
  <p class="sub">Tempel tautan panjang, dapatkan yang singkat.</p>
  <label for="url">Tautan panjang</label>
  <input id="url" type="url" placeholder="https://contoh.com/artikel/yang/sangat/panjang">
  <label for="alias">Alias kustom (opsional)</label>
  <input id="alias" type="text" placeholder="promo-natal">
  <button id="go">Perpendek</button>
  <div id="error"></div>
  <div id="result">
    <a id="short" target="_blank" rel="noopener"></a>
    <button id="copy">Salin</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
$('go').onclick = async () => {
  $('error').textContent = ''; $('result').style.display = 'none';
  try {
    const res = await fetch('/api/shorten', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value.trim(), alias: $('alias').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    $('short').href = $('short').textContent = data.shortUrl;
    $('result').style.display = 'block';
  } catch (e) { $('error').textContent = e.message; }
};
$('copy').onclick = async () => {
  await navigator.clipboard.writeText($('short').textContent);
  $('copy').textContent = 'Tersalin ✓';
  setTimeout(() => $('copy').textContent = 'Salin', 1500);
};
</script>
</body>
</html>
