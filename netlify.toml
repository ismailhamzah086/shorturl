[build]
  publish = "public"
  functions = "netlify/functions"

# Urutan penting: aturan khusus dulu, /:slug terakhir.
[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/list"
  to = "/.netlify/functions/list"
  status = 200

[[redirects]]
  from = "/:slug"
  to = "/.netlify/functions/go?slug=:slug"
  status = 200
